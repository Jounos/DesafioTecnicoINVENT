specVersion: "4.0"
metadata:
  name: ui5.desafio-tecnico
type: application
framework:
  name: OpenUI5
  version: "1.141.1"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: "/api"
      configuration:
        baseUri: "http://localhost:5031"
  settings:
    httpPort: 55500