specVersion: "4.0"
metadata:
  name: desafio
type: application
resources:
  configuration:
    paths:
      webapp: src
framework:
  name: OpenUI5
  version: "1.141.0"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.uxap
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /api
    configuration:
      baseUri: "https://localhost/7005"
  settings:
    httpPort: 55500
